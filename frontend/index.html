<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Task Manager — Mini Project</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="container">
    <header>
      <h1>Task Manager</h1>
      <p class="subtitle">Flask API + Frontend Mini-Project</p>
      <div id="api-status" class="status" aria-live="polite"></div>
    </header>

    <section class="add-task">
      <h2>Add task</h2>
      <form id="form-add" novalidate>
        <label for="title">Title <span class="required">*</span></label>
        <input type="text" id="title" name="title" required placeholder="Task title" />
        <label for="description">Description</label>
        <textarea id="description" name="description" rows="2" placeholder="Optional description"></textarea>
        <button type="submit">Add task</button>
      </form>
      <div id="form-message" class="message" aria-live="polite"></div>
    </section>

    <section class="weather-section">
      <h2>Weather forecast</h2>
      <p class="weather-desc">Current conditions and 7-day forecast for a location. Uses <a href="https://open-meteo.com/" target="_blank" rel="noopener">Open-Meteo</a> via our backend.</p>
      <div class="weather-form">
        <label for="weather-city">Location (city name)</label>
        <div class="weather-input-row">
          <input type="text" id="weather-city" placeholder="e.g. London, Tokyo, New York" />
          <button type="button" id="weather-fetch">Get forecast</button>
        </div>
      </div>
      <div id="weather-loading" class="loading" hidden>Fetching weather…</div>
      <div id="weather-error" class="error" hidden></div>
      <div id="weather-result" class="weather-result" hidden></div>
    </section>

    <section class="task-list">
      <h2>Tasks</h2>
      <div id="tasks-loading" class="loading" hidden>Loading tasks…</div>
      <div id="tasks-error" class="error" hidden></div>
      <ul id="task-list" class="task-list-ul"></ul>
    </section>
  </div>

  <script src="js/app.js"></script>
</body>
</html>
